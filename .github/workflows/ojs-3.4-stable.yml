on: [push, pull_request]
name: ojs-3.4-stable
jobs:
  iiifViewer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: ojs
            php-version: 8.1
            database: mysql
          - application: ojs
            php-version: 8.2
            database: mysql
          - application: ojs
            php-version: 8.2
            database: pgsql
          - application: ojs
            php-version: 8.2
            database: pgsql

    name: iiifViewer
    steps:
      - uses: pkp/pkp-github-actions@v1
        with:
          node_version: 16
          branch: stable-3_4_0
          repository: pkp
          plugin: true
          dataset_inject: true
